name: Uppdatera parkeringsdata

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/update-parking-data.yml"
      - "Scripts/**"

concurrency:
  group: update-parking-data
  cancel-in-progress: false

jobs:
  test:
    name: Testa datatransformering
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checka ut repot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Konfigurera Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Kör datatester
        run: python -m unittest discover -s Scripts/tests -p "test_*.py"

  update:
    name: Hämta, validera och föreslå ny data
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      DATA_FILE: MCParkering/mc_parkering_sthlm.json
      UPDATE_BRANCH: automation/update-parking-data

    steps:
      - name: Checka ut repot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Konfigurera Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Kontrollera API-nyckel
        env:
          OPEN_PARKING_API_KEY: ${{ secrets.OPEN_PARKING_API_KEY }}
        run: |
          if [[ -z "$OPEN_PARKING_API_KEY" ]]; then
            echo "::error::Repository secret OPEN_PARKING_API_KEY saknas."
            exit 1
          fi

      - name: Hämta och validera parkeringsdata
        env:
          OPEN_PARKING_API_KEY: ${{ secrets.OPEN_PARKING_API_KEY }}
        run: python Scripts/update_parking_data.py

      - name: Sammanfatta ändring
        id: data
        run: |
          count=$(python -c 'import json; print(len(json.load(open("MCParkering/mc_parkering_sthlm.json"))))')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- "$DATA_FILE"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Ingen dataändring hittades ($count poster)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "En uppdatering med $count poster är redo för granskning." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Skapa uppdateringsbranch
        if: steps.data.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$UPDATE_BRANCH"
          git add -- "$DATA_FILE"
          git commit -m "Update Stockholm parking data ($(date -u +%F))"
          git push --force-with-lease origin "HEAD:refs/heads/$UPDATE_BRANCH"

      - name: Öppna eller uppdatera draft pull request
        if: steps.data.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RECORD_COUNT: ${{ steps.data.outputs.count }}
        run: |
          existing_pr=$(gh pr list --base main --head "$UPDATE_BRANCH" --state open --json number --jq '.[0].number')
          if [[ -n "$existing_pr" ]]; then
            echo "Uppdaterade befintlig draft pull request #$existing_pr." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          body_file="$RUNNER_TEMP/parking-data-pr.md"
          {
            echo "## Automatisk datauppdatering"
            echo
            echo "GitHub Actions har hämtat och validerat Stockholms MC-parkeringsdata."
            echo
            echo "- Poster: $RECORD_COUNT"
            echo "- Källa: Stockholms stads Open Parking API"
            echo "- Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "Granska diffen och slå ihop först när ändringen ser rimlig ut."
          } > "$body_file"

          gh pr create \
            --base main \
            --head "$UPDATE_BRANCH" \
            --title "Update Stockholm parking data" \
            --body-file "$body_file" \
            --draft
